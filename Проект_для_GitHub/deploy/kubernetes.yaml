apiVersion: v1
kind: Namespace
metadata:
  name: pattern-consumer
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pattern-consumer
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: v1
kind: Namespace
metadata:
  name: pattern-provider
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pattern-provider
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-api
  namespace: pattern-consumer
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: pattern-consumer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: order-api
        image: course-pattern:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8443
        env:
        - name: PATTERN_CONFIG
          value: /run/pattern/config.json
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /run/pattern
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /health
            port: 8443
          initialDelaySeconds: 3
        livenessProbe:
          httpGet:
            scheme: HTTPS
            path: /health
            port: 8443
          initialDelaySeconds: 15
      volumes:
      - name: config
        secret:
          secretName: order-api-config
          defaultMode: 288
      - name: data
        persistentVolumeClaim:
          claimName: order-api
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: pattern-consumer
spec:
  selector:
    app: order-api
  ports:
  - port: 8443
    targetPort: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-api
  namespace: pattern-consumer
spec:
  podSelector:
    matchLabels:
      app: order-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pattern-consumer
      podSelector:
        matchLabels:
          app: nextcloud
    ports: &id001
    - protocol: TCP
      port: 8443
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pattern-consumer
      podSelector:
        matchLabels:
          app: prometheus
    ports: *id001
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pattern-consumer
      podSelector:
        matchLabels:
          app: identity-policy
    ports: *id001
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pattern-consumer
      podSelector:
        matchLabels:
          app: security-crypto
    ports: *id001
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
